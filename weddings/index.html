<style>

  :root{
    --bg: #f7f6f2;
    --ink: #1a170f;
    --ink-soft: rgba(26,23,15,0.56);
    --ink-faint: rgba(26,23,15,0.34);
    --line: rgba(26,23,15,0.15);
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'ABC Favorit Mono Light', 'ABC Favorit Mono', monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img, video{ max-width: 100%; display: block; }

  /* ---------- Password gate (same pattern as the case studies) ---------- */
  #gate{ position:fixed; inset:0; z-index:9999; background:#f7f6f2; display:flex; align-items:center; justify-content:center; transition:opacity 0.5s ease; }
  #gate.unlocked{ opacity:0; pointer-events:none; }
  #gate form{ display:flex; flex-direction:column; align-items:center; gap:1.4em; }
  #gate input{
    font-family:'ABC Favorit Mono Light','ABC Favorit Mono',monospace; font-size:0.85rem; letter-spacing:0.04em;
    background:transparent; border:none; border-bottom:1px solid rgba(26,23,15,0.34); color:#1a170f;
    text-align:center; padding:0.5em 0; width:14em; outline:none;
  }
  #gate input::placeholder{ color:rgba(26,23,15,0.34); }
  #gate .err{ font-size:0.7rem; letter-spacing:0.06em; color:#1a170f; opacity:0; height:1em; }
  #gate .err.show{ opacity:0.55; }
  #siteContent{ transition:opacity 0.4s ease; }
  #siteContent.hidden{ opacity:0; }

  /* ---------- Persistent fixed overlay: identity (bottom-left) + current item name (top-right) ---------- */
  .identity-corner{
    position: fixed; left: 4vw; bottom: 3.6vh; z-index: 46;
    color: #fff; mix-blend-mode: difference; pointer-events: none;
  }
  .identity-corner .id-name{ font-size: 0.76rem; letter-spacing: 0.14em; }
  .identity-corner .id-sub{ font-family: 'IM Fell French Canon', serif; font-style: italic; font-size: 1.05rem; margin-top: 0.2em; }

  .item-title{
    position: fixed; top: 3.6vh; right: 4vw; z-index: 46;
    color: #fff; mix-blend-mode: difference; pointer-events: none;
    font-size: 0.76rem; letter-spacing: 0.1em; text-align: right;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .item-title.visible{ opacity: 1; }

  /* ---------- Hero ---------- */
  .hero{ height: 100vh; position: relative; display: flex; align-items: center; }
  .hero-heading{
    font-family: 'IM Fell French Canon', serif; font-style: italic;
    font-size: clamp(2.2rem, 5vw, 4.2rem);
    line-height: 1.25; max-width: 16ch;
    padding-left: 4vw;
  }

  /* ---------- Media stream ---------- */
  .media-item{ width: 100%; }
  .media-item.image-slot{ height: 100vh; }
  .media-item.image-slot img{ width: 100%; height: 100%; object-fit: cover; }
  .media-item.video-slot{
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .media-item.video-slot video{
    max-width: 60vw; max-height: 80vh; width: auto; height: auto;
  }

  @media (max-width: 880px){
    .identity-corner{ display: none; }
    .item-title{ display: none; }
    .hero-heading{ font-size: clamp(1.8rem, 8vw, 2.6rem); padding-left: 6vw; }
    .media-item.video-slot video{ max-width: 88vw; max-height: 70vh; }
  }
</style>

<script>
  (function(){
    var itemTitle = document.getElementById('itemTitle');
    var items = Array.prototype.slice.call(document.querySelectorAll('.media-item'));

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var video = entry.target.querySelector('video');
        if(entry.isIntersecting){
          itemTitle.textContent = entry.target.getAttribute('data-name');
          itemTitle.classList.add('visible');
          if(video){
            if(!video.src && video.dataset.src){ video.src = video.dataset.src; }
            video.play().catch(function(){});
          }
        } else if(video){
          video.pause();
        }
      });
    }, { threshold: 0.5 });
    items.forEach(function(el){ io.observe(el); });

    var heroIo = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ itemTitle.classList.remove('visible'); }
      });
    }, { threshold: 0.3 });
    var heroEl = document.querySelector('.hero');
    if(heroEl){ heroIo.observe(heroEl); }
  })();
</script>

<script>
  (function(){
    var CORRECT_HASH = '158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab';
    var gate = document.getElementById('gate');
    var content = document.getElementById('siteContent');
    var form = document.getElementById('gateForm');
    var input = document.getElementById('gatePassword');
    var err = document.getElementById('gateErr');

    function sha256(str){
      var data = new TextEncoder().encode(str);
      return crypto.subtle.digest('SHA-256', data).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
    }
    function unlock(){
      gate.classList.add('unlocked');
      content.classList.remove('hidden');
      try{ localStorage.setItem('weddings-unlocked', '1'); }catch(e){}
    }
    if(localStorage.getItem('weddings-unlocked') === '1'){ unlock(); }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      sha256(input.value).then(function(hash){
        if(hash === CORRECT_HASH){ unlock(); }
        else { err.classList.add('show'); input.value=''; }
      });
    });
  })();
</script>
